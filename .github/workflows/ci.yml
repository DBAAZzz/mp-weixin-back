name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v7/v6：旧版 action 跑在 Node 20 上，已被 GitHub 强制升到 Node 24 并告警
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # example/web 不进 workspace（有自己的 lockfile），要单独装一遍
      - name: Install example/web dependencies
        run: pnpm --dir example/web install --no-frozen-lockfile

      # 根套件 + example/web 套件。example/web 验证的是转换产物本身，
      # 是「插件确实生效」的唯一自动化证据，不能只跑根套件就说测试通过。
      - name: Test
        run: pnpm test:all

      - name: Build
        run: pnpm build
