name: Publish to npm

on:
  push:
    branches:
      - main
  # 允许在 Actions 页面手动触发一次发布流程（例如重跑上次失败的发布）
  workflow_dispatch:

# 串行化：两次快速 push 到 main 时若并发执行，两个 job 可能同时判定「有待发布版本」
# 并都去 publish，第二个会撞上 E403（cannot publish over an already published
# version）。cancel-in-progress 必须保持 false —— 取消一次正在 publish 的流程可能
# 留下「版本号已写入、包没发全」的中间态。让它们排队，不取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 递归防护说明：下面用 secrets.GITHUB_TOKEN push 版本提交。GitHub 规定
# 「由 GITHUB_TOKEN 触发的事件不会创建新的 workflow run」，所以这次 push 不会
# 再触发本 workflow。**若将来改用 PAT / GitHub App token，该防护立即失效**，
# 必须自己加防循环条件（例如判提交信息里是否只有版本提升）。
# 注：不要依赖 `[skip ci]` —— 默认不生效（见 readme）。

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史：下面会校验「本 commit 的版本号是否已在 npm 上」并 push
          # 回 main。浅克隆会让 push 与 diff 判定出错。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # 早失败：没有 token 时让这一步就炸，而不是拖到 publish 才报
      # 一个不说明原因的 E401。
      - name: Verify NPM_TOKEN is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::仓库未配置 NPM_TOKEN secret（Settings → Secrets and variables → Actions）。"
            echo "发布需要它来向 npm 认证。"
            exit 1
          fi
          echo "NPM_TOKEN 已配置（长度 ${#NODE_AUTH_TOKEN}）"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # pnpm release 里跑的是 test:all，含 example/web 套件。它不进 workspace
      # （有自己的 lockfile），必须单独装一遍，否则发布会挂在测试这一步。
      - name: Install example/web dependencies
        run: pnpm --dir example/web install --no-frozen-lockfile

      # 关键一步：把「已合并的改动」变成版本号 + CHANGELOG。
      # `changeset version` 会消费并删除 .changeset/*.md。没有 changeset 时它只是
      # 打一行 warn 退出（exit 0），不构成失败。
      - name: Apply version bump from changesets
        run: pnpm exec changeset version

      # 把版本提升提交回 main，让仓库里的版本号与已发布的版本一致。
      #
      # ⚠️ 这里**必须**在发布前确定「本次要不要发」，并把结论传给后面的步骤，
      # 不能再依赖 changesets/action 去猜 —— 它判断的是工作区里 .changeset/*.md
      # 是否还在，而 `changeset version` 只把这些文件的删除**暂存**（git add），
      # 工作区文件依旧存在，于是 action 会误判成「还有 changeset」→ 去开一个
      # Version Packages PR 而不是发布，「合并即发布」直接失效。
      - name: Commit version bump
        id: bump
        run: |
          if git diff --quiet -- package.json CHANGELOG.md 2>/dev/null; then
            echo "无版本变更（本次 push 没有待消费的 changeset）。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md .changeset
          git commit -m "chore: release v${VERSION}"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 直接跑发布脚本，不再经过 changesets/action：
      #   - 该 action 靠 stdout 里的 `New tag:` 判定是否发布，而 release.mjs 走的是
      #     自定义脚本（不打印 `New tag:`），结论恒为「未发布」，摘要与实际相反；
      #   - 无 changeset 时它还会误进版本分支（见上）。
      # release.mjs 自己有 isPublished() 闸门：版本已在 npm 上就直接跳过。
      - name: Publish
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          pnpm release 2>&1 | tee /tmp/release.log
          if grep -q "already exists on npm" /tmp/release.log; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # 让 Actions 摘要页直接显示结果，省得翻日志
      - name: Publish summary
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
          BUMPED: ${{ steps.bump.outputs.changed }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          {
            echo "### 发布结果"
            echo ""
            if [ "$PUBLISHED" = "true" ]; then
              echo "已发布到 npm：\`mp-weixin-back@${VERSION}\`"
            elif [ "$BUMPED" = "true" ]; then
              echo "本次做了版本提升（\`${VERSION}\`），但发布步骤未完成 —— 请查看上面 Publish 步骤的日志。"
            else
              echo "本次未发布：这次 push 里没有待消费的 changeset（\`.changeset/*.md\`），"
              echo "当前版本号也已经存在于 npm 上。"
              echo ""
              echo "要发新版本，先跑 \`pnpm changeset\` 并把生成的 \`.changeset/*.md\` 一起提交。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
